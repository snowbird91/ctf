name: Deploy Jekyll site to Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"  # refresh rankings daily at 6 AM UTC

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch CTFtime rankings
        run: |
          mkdir -p _data
          YEAR=$(date +%Y)
          L3AK=$(curl -sf -H "User-Agent: Mozilla/5.0" "https://ctftime.org/api/v1/teams/220336/" || echo '{}')
          TJCSC=$(curl -sf -H "User-Agent: Mozilla/5.0" "https://ctftime.org/api/v1/teams/53812/" || echo '{}')
          FISH=$(curl -sf -H "User-Agent: Mozilla/5.0" "https://ctftime.org/api/v1/teams/299716/" || echo '{}')
          cat > _data/ctftime.json << ENDJSON
          {
            "year": $YEAR,
            "l3ak": {
              "world": $(echo "$L3AK" | python3 -c "import sys,json; d=json.load(sys.stdin); r=d.get('rating',{}).get(str($YEAR),{}); print(r.get('rating_place',0))" 2>/dev/null || echo 0),
              "country": $(echo "$L3AK" | python3 -c "import sys,json; d=json.load(sys.stdin); r=d.get('rating',{}).get(str($YEAR),{}); print(r.get('country_place',0))" 2>/dev/null || echo 0),
              "country_code": $(echo "$L3AK" | python3 -c "import sys,json; d=json.load(sys.stdin); print('\"'+d.get('country','')+'\"')" 2>/dev/null || echo '\"\"')
            },
            "tjcsc": {
              "world": $(echo "$TJCSC" | python3 -c "import sys,json; d=json.load(sys.stdin); r=d.get('rating',{}).get(str($YEAR),{}); print(r.get('rating_place',0))" 2>/dev/null || echo 0),
              "country": $(echo "$TJCSC" | python3 -c "import sys,json; d=json.load(sys.stdin); r=d.get('rating',{}).get(str($YEAR),{}); print(r.get('country_place',0))" 2>/dev/null || echo 0),
              "country_code": $(echo "$TJCSC" | python3 -c "import sys,json; d=json.load(sys.stdin); print('\"'+d.get('country','')+'\"')" 2>/dev/null || echo '""')
            },
            "fish": {
              "world": $(echo "$FISH" | python3 -c "import sys,json; d=json.load(sys.stdin); r=d.get('rating',{}).get(str($YEAR),{}); print(r.get('rating_place',0))" 2>/dev/null || echo 0),
              "country": $(echo "$FISH" | python3 -c "import sys,json; d=json.load(sys.stdin); r=d.get('rating',{}).get(str($YEAR),{}); print(r.get('country_place',0))" 2>/dev/null || echo 0),
              "country_code": $(echo "$FISH" | python3 -c "import sys,json; d=json.load(sys.stdin); print('\"'+d.get('country','')+'\"')" 2>/dev/null || echo '""')
            }
          }
          ENDJSON

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
