name: Build Ariadne solver APK

on:
  push:
    branches:
      - chatgpt/ariadne-apk-fix-20260905
    paths:
      - .github/workflows/ariadne-apk-build.yml
      - tools/ariadne_ci_project.zip.part*
  workflow_dispatch:

permissions:
  contents: write

env:
  APK_PATH: tools/ariadne_solver_v2_READY.apk
  APK_SHA_PATH: tools/ariadne_solver_v2_READY.sha256

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: chatgpt/ariadne-apk-fix-20260905
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Ensure Android SDK packages
        shell: bash
        run: |
          set -euxo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME" -type f -name sdkmanager -print -quit || true)"
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null || true
            "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
          fi
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"

      - name: Reconstruct Android project
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf /tmp/ariadne-project /tmp/ariadne-project.zip
          mkdir -p /tmp/ariadne-project
          cat tools/ariadne_ci_project.zip.part* > /tmp/ariadne-project.zip
          unzip -t /tmp/ariadne-project.zip
          unzip -q /tmp/ariadne-project.zip -d /tmp/ariadne-project

      - name: Build and verify signed debug APK
        shell: bash
        run: |
          set -euxo pipefail
          gradle --no-daemon -p /tmp/ariadne-project :app:assembleDebug --stacktrace
          BUILT_APK=/tmp/ariadne-project/app/build/outputs/apk/debug/app-debug.apk
          test -s "$BUILT_APK"
          unzip -t "$BUILT_APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V | tail -1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$BUILT_APK"
          cp "$BUILT_APK" "$APK_PATH"
          sha256sum "$APK_PATH" | sed 's#  .*#  ariadne_solver_v2_READY.apk#' > "$APK_SHA_PATH"
          test -s "$APK_PATH"
          wc -c "$APK_PATH"
          cat "$APK_SHA_PATH"

      - name: Persist APK to branch
        shell: bash
        run: |
          set -euxo pipefail
          rm -f tools/ariadne_solver_v2_READY.apk.b64
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A tools/ariadne_solver_v2_READY*
          if git diff --cached --quiet; then
            echo 'No APK output change.'
          else
            git commit -m 'Publish Ariadne solver APK binary [skip ci]'
            git push origin HEAD:chatgpt/ariadne-apk-fix-20260905
          fi

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ariadne-solver-v2
          path: |
            tools/ariadne_solver_v2_READY.apk
            tools/ariadne_solver_v2_READY.sha256
          if-no-files-found: error
          retention-days: 1
